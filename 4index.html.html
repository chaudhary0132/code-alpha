<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player - CodeAlpha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .player-card {
            background: #0f172a;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .cover-art {
            width: 100%;
            height: 220px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .song-info h2 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #38bdf8;
        }

        .song-info p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: #334155;
            height: 6px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #38bdf8;
            border-radius: 5px;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-ctrl {
            background: #1e293b;
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-ctrl:hover {
            background: #334155;
            color: #38bdf8;
        }

        .btn-play {
            width: 55px;
            height: 55px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .btn-play:hover {
            background: #0284c7;
            color: #fff;
        }

        /* Volume Control */
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .volume-container input {
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* Playlist */
        .playlist {
            text-align: left;
            background: #1e293b;
            padding: 12px;
            border-radius: 10px;
            max-height: 120px;
            overflow-y: auto;
        }

        .playlist h4 {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .playlist-item {
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.2s;
        }

        .playlist-item:hover, .playlist-item.active {
            background: #334155;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <img id="cover" class="cover-art" src="https://picsum.photos/id/146/400/300" alt="Cover Art">

        <div class="song-info">
            <h2 id="title">Song Title</h2>
            <p id="artist">Artist Name</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="time-stamps">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="btn-ctrl" id="prevBtn">&#10094;&#10094;</button>
            <button class="btn-ctrl btn-play" id="playBtn">&#9654;</button>
            <button class="btn-ctrl" id="nextBtn">&#10095;&#10095;</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="0.8">
        </div>

        <!-- Playlist (Bonus Feature) -->
        <div class="playlist">
            <h4>Playlist</h4>
            <div id="playlistItems"></div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio"></audio>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const cover = document.getElementById('cover');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeControl = document.getElementById('volumeControl');
        const playlistItems = document.getElementById('playlistItems');

        // Sample Royalty Free Songs List
        const songs = [
            {
                title: 'Acoustic Breeze',
                artist: 'Benjamin Tissot',
                src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
                cover: 'https://picsum.photos/id/146/400/300'
            },
            {
                title: 'Creative Minds',
                artist: 'Bensound',
                src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
                cover: 'https://picsum.photos/id/1082/400/300'
            },
            {
                title: 'Ukulele Melody',
                artist: 'Royalty Free',
                src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
                cover: 'https://picsum.photos/id/1025/400/300'
            }
        ];

        let songIndex = 0;
        let isPlaying = false;

        function loadSong(song) {
            title.innerText = song.title;
            artist.innerText = song.artist;
            audio.src = song.src;
            cover.src = song.cover;
            updatePlaylistUI();
        }

        function playSong() {
            isPlaying = true;
            playBtn.innerHTML = '&#10074;&#10074;'; // Pause icon
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            playBtn.innerHTML = '&#9654;'; // Play icon
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        });

        prevBtn.addEventListener('click', () => {
            songIndex = (songIndex - 1 + songs.length) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        nextBtn.addEventListener('click', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        // Time and Progress Bar Update
        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            if (isNaN(duration)) return;

            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Calculate display time
            const currentMinutes = Math.floor(currentTime / 60);
            let currentSeconds = Math.floor(currentTime % 60);
            if (currentSeconds < 10) currentSeconds = `0${currentSeconds}`;
            currentTimeEl.innerText = `${currentMinutes}:${currentSeconds}`;

            const durationMinutes = Math.floor(duration / 60);
            let durationSeconds = Math.floor(duration % 60);
            if (durationSeconds < 10) durationSeconds = `0${durationSeconds}`;
            durationEl.innerText = `${durationMinutes}:${durationSeconds}`;
        });

        // Click on Progress Bar
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        // Volume Control
        volumeControl.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Auto-play Next Song when Current Ends
        audio.addEventListener('ended', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        // Render Playlist
        function renderPlaylist() {
            playlistItems.innerHTML = '';
            songs.forEach((song, index) => {
                const div = document.createElement('div');
                div.classList.add('playlist-item');
                div.innerText = `${index + 1}. ${song.title} - ${song.artist}`;
                div.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                });
                playlistItems.appendChild(div);
            });
        }

        function updatePlaylistUI() {
            const items = document.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                if (index === songIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Initial Setup
        renderPlaylist();
        loadSong(songs[songIndex]);
    </script>
</body>
</html>
