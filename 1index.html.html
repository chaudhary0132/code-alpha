<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - CodeAlpha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 15px;
            color: #333;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn.active, .btn:hover {
            background: #007bff;
            color: #fff;
        }

        /* Gallery Grid */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        /* Hover Effect */
        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox-img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 35px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            font-size: 30px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            color: #000;
        }

        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <!-- Category Filter Buttons -->
        <div class="filter-buttons">
            <button class="btn active" data-filter="all">All</button>
            <button class="btn" data-filter="nature">Nature</button>
            <button class="btn" data-filter="tech">Tech</button>
            <button class="btn" data-filter="cars">Cars</button>
        </div>
    </header>

    <!-- Gallery Grid -->
    <div class="gallery-container">
        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1015/600/400" alt="Nature 1">
        </div>
        <div class="gallery-item tech">
            <img src="https://picsum.photos/id/1/600/400" alt="Tech 1">
        </div>
        <div class="gallery-item cars">
            <img src="https://picsum.photos/id/111/600/400" alt="Car 1">
        </div>
        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1043/600/400" alt="Nature 2">
        </div>
        <div class="gallery-item tech">
            <img src="https://picsum.photos/id/180/600/400" alt="Tech 2">
        </div>
        <div class="gallery-item cars">
            <img src="https://picsum.photos/id/133/600/400" alt="Car 2">
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="Popup Image">
        <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>

    <script>
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const filterBtns = document.querySelectorAll('.filter-buttons .btn');

        let currentIndex = 0;
        let visibleImages = [];

        function updateVisibleImages() {
            visibleImages = Array.from(document.querySelectorAll('.gallery-item'))
                .filter(item => item.style.display !== 'none')
                .map(item => item.querySelector('img'));
        }

        galleryItems.forEach((img) => {
            img.addEventListener('click', () => {
                updateVisibleImages();
                currentIndex = visibleImages.indexOf(img);
                showImage(currentIndex);
                lightbox.style.display = 'flex';
            });
        });

        function showImage(index) {
            if (visibleImages.length > 0) {
                lightboxImg.src = visibleImages[index].src;
            }
        }

        closeBtn.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % visibleImages.length;
            showImage(currentIndex);
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + visibleImages.length) % visibleImages.length;
            showImage(currentIndex);
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.filter-buttons .active').classList.remove('active');
                btn.classList.add('active');

                const filter = btn.getAttribute('data-filter');
                const items = document.querySelectorAll('.gallery-item');

                items.forEach(item => {
                    if (filter === 'all' || item.classList.contains(filter)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
